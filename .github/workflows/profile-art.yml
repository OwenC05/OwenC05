name: Refresh profile artwork

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-art.yml'
      - 'scripts/render-activity.mjs'
      - 'scripts/verify-snake.py'

permissions: {}

concurrency:
  group: profile-art-main
  cancel-in-progress: false

jobs:
  artwork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render contribution charts
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          gh api graphql -f login="$PROFILE_OWNER" -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }' | node scripts/render-activity.mjs

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg {"palette":"github-light","color_snake":"#0969da","color_dots":["#eff2f5","#aceebb","#4ac26b","#2da44e","#116329"],"color_dot_border":"#1f23280d"}
            assets/snake-dark.svg {"palette":"github-dark","color_snake":"#22d3ee","color_dots":["#151b23","#033a16","#196c2e","#2ea043","#56d364"],"color_dot_border":"#0104090d"}

      - name: Check both snakes against the public profile calendar
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 "https://github.com/users/$PROFILE_OWNER/contributions" | python3 scripts/verify-snake.py

      - name: Save updated artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity-light.svg assets/activity-dark.svg assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Profile artwork is already current.'
            exit 0
          fi
          git commit -m 'Refresh contribution artwork'
          git push origin HEAD:main
