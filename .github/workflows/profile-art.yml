name: Refresh profile artwork

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-art.yml'
      - 'scripts/render-activity.mjs'

permissions: {}

concurrency:
  group: profile-art-main
  cancel-in-progress: false

jobs:
  artwork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render contribution charts
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          gh api graphql -f login="$PROFILE_OWNER" -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }' | node scripts/render-activity.mjs

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=%230969da
            assets/snake-dark.svg?palette=github-dark&color_snake=%2322d3ee

      - name: Save updated artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity-light.svg assets/activity-dark.svg assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Profile artwork is already current.'
            exit 0
          fi
          git commit -m 'Refresh contribution artwork'
          git push origin HEAD:main
